name: Daily forecast update

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests scikit-learn
      - run: python update.py
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/openmeteo_daily.csv data/processed/forecast_latest.csv data/processed/forecast_history.csv
          git diff --cached --quiet || git commit -m "Daily forecast update"
          git push